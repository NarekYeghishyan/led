; Copy to config.ini and fill in. config.ini is in .gitignore — never commit it.

[access]
db_path = D:\LED\Data.mdb
; the Access database password
password =

[api]
url = https://led.creativeweb.am/api
; same value as SYNC_API_KEY on the server
key =
timeout = 30

[agent]
interval_seconds = 5
lookup_interval_seconds = 120
batch_size = 500
; also compare with the ids on the site (catches rows deleted while the agent was off)
reconcile_interval_seconds = 3600
# tell the site the agent is alive (admin shows "Agent: online")
heartbeat_seconds = 60
; state_file = D:\led-agent\state.sqlite
; log_dir = D:\led-agent\logs

[products]
table = Товары

[categories]
table = Типы
; leave empty to auto-detect (first column = id, first text column = name)
id_column =
name_column =

[currencies]
table = Валюты
id_column =
name_column =

[mirror]
; copy EVERY Access table to the site (admin -> "Таблицы Access"), every change is logged
enabled = true
interval_seconds = 30
batch_size = 500
; only these tables (comma separated); empty = all tables
tables =
; never copy these tables
exclude =
