<!--responsive--><style>
/* product page: compare bar sits above the sticky buy bar (all widths; phones override below) */

html,body{max-width:100%;overflow-x:clip}
img,video{max-width:100%}
.flt-hd,.flt-go{display:none}
/* grid children must be allowed to shrink (long words/inputs blew tracks out) */

@media (max-width:1100px){
  .asm-grid{grid-template-columns:minmax(0,1fr) minmax(300px,340px)!important}

}
@media (min-width:761px) and (max-width:1000px){
  .h .row{flex-wrap:wrap;height:auto;padding:12px 0;row-gap:10px}
  .h .search{order:9;flex:1 1 100%;max-width:none}
  .h .acts{margin-left:auto}
}
@media (min-width:761px) and (max-width:1100px){
  nav.cats:not(.icons){display:flex!important;flex-wrap:wrap;justify-content:flex-start}
  nav.cats:not(.icons) a{flex:1 1 auto;justify-content:center}
  nav.cats:not(.icons) a.tool{flex:0 0 auto}
}
@media (max-width:760px){
  .top .wrap{gap:8px}

  .top .ph{padding:6px 4px}
  .h .row{gap:10px}

  .sp-cart{grid-template-columns:minmax(0,1fr)!important}

}

  .cmp-bar.show{transform:none}

  body:has(.sbar.show) .cmp-bar.show{bottom:84px}
  body:has(.sbar.show) .fab{bottom:84px}

  body:has(.cmp-bar.show) .fab{bottom:84px}
  body:has(.sbar.show):has(.cmp-bar.show) .fab{bottom:152px}
  .sbar .wrap{gap:10px}
  .toast{max-width:calc(100vw - 24px)}
  /* catalog menu: full screen above everything, one scroll, close button always visible */
  .mega{z-index:1000!important}

  .mega-g{max-height:none!important;overflow:visible!important}

  .mega-l{padding-top:12px!important;padding-right:60px!important}

  body.mega-open .top,body.flt-open .top,body.flt-open header.h{visibility:hidden}
  /* filters drawer */

  body.flt-open .flt-go{display:block;position:fixed;left:16px;right:16px;bottom:16px;z-index:1001;border:0;border-radius:12px;padding:15px;background:var(--blue-600);color:#fff;font:inherit;font-weight:700;font-size:16px;box-shadow:0 10px 30px rgba(20,104,220,.35);cursor:pointer}
  body.flt-open .fab{display:none}

/* compare: sticky product row sits right under the real header height (taller on phones) */
/* the table sits in a horizontal scroller (.sp-cmpw), which is its sticky container — any top offset left a blank strip */

.sp-pc b,.sp-pc s,.sp-f b,.pr b,.sp-sum b{white-space:nowrap}

  .fgrid>*:first-child{grid-column:1/-1}

 .cgrid3:not(.list) .mi-act{flex-direction:column!important;gap:6px;margin-top:12px}
 .cgrid3:not(.list) .mi-act>*{flex:none!important;width:100%;height:38px;box-sizing:border-box;padding:0 8px;font-size:13px;white-space:nowrap;overflow:hidden}

 .sh{flex-wrap:wrap;gap:4px 12px;align-items:baseline}.sh h2{font-size:22px}.sh>a{font-size:13.5px}
 .sg dt{align-items:flex-start!important}.ptabs{scrollbar-width:none}.ptabs::-webkit-scrollbar{display:none}
}
/* phone pass 2 */
@media (max-width:1000px){.ip>.ip-nav:not(.ac-nav){order:2}}
@media (max-width:600px){
 .ip-hero{flex-direction:row!important;align-items:center!important;gap:14px!important;padding:18px 18px!important}
 .ip-hero .ic{width:48px!important;height:48px!important;border-radius:14px!important}.ip-hero .ic svg{width:24px!important;height:24px!important}
 .ip-hero h1{font-size:21px!important;margin:0 0 4px!important}.ip-hero p{font-size:13.5px!important}
 .ip-card{padding:18px 16px!important}.ip-card h2{font-size:18px}
 .asm-row{grid-template-columns:40px minmax(0,1fr) auto 28px!important;grid-template-areas:"ic t pr x" "sel sel q q";gap:10px!important;padding:12px 14px!important}
 .asm-row>.ic{grid-area:ic;width:40px;height:40px}.asm-row>b{grid-area:t}.asm-row>.pr{grid-area:pr}.asm-row>.x,.asm-row>span:nth-child(6){grid-area:x}
 .asm-row>select{grid-area:sel}.asm-row>.asm-q{grid-area:q;justify-self:end}
 .asm-row:not(.on)>.asm-q,.asm-row:not(.on)>.pr,.asm-row:not(.on)>span:nth-child(6){display:none}
 .asm-row:not(.on){grid-template-areas:"ic t t t" "sel sel sel sel"}
 .asm-row>.asm-warn{grid-column:1/-1}
 .sg dl div{grid-template-columns:minmax(0,42%) minmax(0,1fr)!important;gap:10px!important;font-size:13.5px}
 .sp-ct col.lab{width:112px!important}.sp-ct th,.sp-ct td{font-size:13px}
 .sp-ct tbody th{padding:10px 8px 10px 12px!important;font-size:12px!important;line-height:1.3;overflow-wrap:anywhere;word-break:break-word;hyphens:auto}
 .sp-ct tr.sec th{white-space:nowrap;overflow:visible;font-size:11.5px!important;z-index:2}
 footer a[href^="tel"]{white-space:nowrap}
}
</style>
<script>(function(){const h=document.querySelector('header');if(!h)return;const set=()=>document.documentElement.style.setProperty('--hdr',(getComputedStyle(h).position==='sticky'||getComputedStyle(h).position==='fixed'?h.offsetHeight:0)+'px');set();addEventListener('resize',set);addEventListener('load',set);})();</script>

<script>
(function(){
  const mq = matchMedia('(max-width:760px)');
  // lock page scroll while the catalog menu covers the screen
  const mega = document.getElementById('mega');
  if (mega) new MutationObserver(() => document.body.classList.toggle('mega-open', mq.matches && !mega.hidden))
    .observe(mega, {attributes: true, attributeFilter: ['hidden']});
  // filters drawer on phones (category page)
  const btn = document.querySelector('.fbtn'), f = document.querySelector('aside.filters');
  if (!btn || !f) return;
  const L = {hy: ['Ֆիլտրեր', 'Ցույց տալ'], ru: ['Фильтры', 'Показать'], en: ['Filters', 'Show']};
  const lang = () => (document.documentElement.lang || 'ru').slice(0, 2);
  const hd = document.createElement('div'); hd.className = 'flt-hd';
  hd.innerHTML = '<span></span><button type="button" aria-label="Close">✕</button>';
  f.prepend(hd);
  const go = document.createElement('button'); go.type = 'button'; go.className = 'flt-go';
  document.body.appendChild(go);
  const label = () => {
    const t = L[lang()] || L.ru, n = document.getElementById('catCount');
    hd.firstChild.textContent = t[0];
    go.textContent = t[1] + (n ? ' (' + n.textContent.trim() + ')' : '');
  };
  const open = on => { document.body.classList.toggle('flt-open', on); if (on) { label(); f.scrollTop = 0; } };
  btn.addEventListener('click', e => { e.preventDefault(); open(true); });
  hd.lastChild.addEventListener('click', () => open(false));
  go.addEventListener('click', () => { open(false); (document.querySelector('.results') || document.body).scrollIntoView({behavior: 'smooth'}); });
  f.addEventListener('input', () => setTimeout(label, 50)); f.addEventListener('click', () => setTimeout(label, 50));
  mq.addEventListener('change', e => { if (!e.matches) open(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape') open(false); });
})();
</script><!--/responsive-->
