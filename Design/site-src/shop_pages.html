<style>

.br-facts{display:flex;gap:28px;flex-wrap:wrap;margin-top:16px}.br-facts small{display:block;color:var(--muted);font-size:12.5px}.br-facts b{font-size:17px}

 .br-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.br-grid.sm{grid-template-columns:repeat(3,minmax(0,1fr))}.br-q{min-width:0;width:100%}}

.sr-dym{font-size:16px}.sr-dym a{color:var(--blue-600);font-weight:700}

.co-inst b{margin-left:auto;font-size:17px}.co-inst b small{font-weight:400;color:var(--muted);font-size:12.5px}

.co-done h1{margin:0 0 12px;font-size:28px}.co-num{display:inline-flex;flex-direction:column;background:var(--blue-50);border-radius:12px;padding:10px 22px;margin-bottom:10px}

@media (max-width:600px){.co-g,.co-pay{grid-template-columns:minmax(0,1fr)}.co-s{padding:16px}.co-done{padding:24px 16px}}
.shop{padding-bottom:56px}
.sp-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:6px 0 22px}

.sp-seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px}

/* cart */
.sp-cart{display:grid;grid-template-columns:1fr 370px;gap:24px;align-items:start}

 Logitech:['ch',1981,24],Kingston:['us',1987,36],AMD:['us',1969,36],Intel:['us',1968,36],NVIDIA:['us',1993,36],'TP-Link':['cn',1996,36],MikroTik:['lv',1996,12],Xiaomi:['cn',2010,12],HyperX:['us',2002,24],Ugreen:['cn',2012,18],LED:['am',2003,36]};
const bslug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,'-');
const logo=(n,big)=>{const g=(window.LEDBrandLogos||{})[n.replace('-','‑')]||(window.LEDBrandLogos||{})[n];
 return g?`<span class="br-lg" style="--bc:${g.c}">${g.svg}</span>`:`<span class="br-lg br-wm" style="--bc:#1468DC">${window.LEDSearch.esc(n)}</span>`};
function brand(){const X=window.LEDSearch;if(!X){root.innerHTML='';addEventListener('DOMContentLoaded',render,{once:true});return}
 const u=new URLSearchParams(location.search),b=(u.get('b')||'').toLowerCase(),cat=u.get('cat')||'',sort=+(u.get('sort')||0);
 const names=[...new Set(X.I.map(x=>x.brand).concat(Object.keys(BI)))].sort((a,c)=>a.localeCompare(c));
 const name=names.find(n=>bslug(n)===b);
 const tile=n=>{const v=X.I.filter(x=>x.brand===n);return `<a class="sp-card br-t" href="/brand.html?b=${bslug(n)}">${logo(n)}<b>${X.esc(n)}</b><small>${v.length} ${bt('prods')}</small></a>`};
 if(!name){document.title=bt('brands')+' — LED Computers';const L0=[...new Set(names.map(n=>n[0].toUpperCase()))];
  root.innerHTML=crumbs(bt('brands'))+`<div class="sp-head"><div><h1><span class="ic">${ic('store')}</span>${bt('brands')}</h1><p>${b?bt('nf')+' · ':''}${bt('brandsP')}</p></div>
   <div class="sp-tools"><input class="br-q" placeholder="${bt('search')}" aria-label="${bt('search')}"></div></div>
   <div class="br-az"><button class="on" data-l="">${bt('all')}</button>${L0.map(l=>`<button data-l="${l}">${l}</button>`).join('')}</div>
   <div class="br-grid">${names.map(n=>tile(n).replace('class="sp-card br-t"',`class="sp-card br-t" data-n="${X.esc(n.toLowerCase())}"`)).join('')}</div>`;return}
 const all=X.I.filter(x=>x.brand===name).map(x=>({...x,score:0})),info=BI[name]||['us',0,12],cs=[...new Set(all.map(x=>x.cat))];
 document.title=`${name} — LED Computers`;
 srResults(all,'',cat,sort,v=>`<nav class="crumbs"><a href="/">${T.home}</a><span>/</span><a href="/brand.html">${bt('brands')}</a><span>/</span><b>${X.esc(name)}</b></nav>
  <div class="br-hero">${logo(name,1)}<div class="br-hi"><span class="br-off">${ic('shield')}${bt('off')}</span><h1>${X.esc(name)}</h1><p>${X.esc(name)} ${bt('about')}</p>
   <div class="br-facts"><div><small>${bt('country')}</small><b>${tt_(BT.C[info[0]])}</b></div>${info[1]?`<div><small>${bt('since')}</small><b>${info[1]}</b></div>`:''}<div><small>${bt('war')}</small><b>${info[2]} ${bt('mo')}</b></div><div><small>${bt('inSt')}</small><b>${all.filter(x=>x.stock).length} / ${all.length}</b></div></div>
   <small class="br-svc">${ic('tool')}${bt('svc')}</small></div></div>
  <div class="sp-head"><div><p>${v.length} ${bt('prods')}</p></div>`);
 const others=names.filter(n=>n!==name&&X.I.some(x=>x.brand===n)).slice(0,8);
 root.insertAdjacentHTML('beforeend',`<section class="sp-up"><h3>${bt('other')}</h3><div class="br-grid sm">${others.map(tile).join('')}</div></section>`);
}
const tt_=a=>a[L()];
root.addEventListener('input',e=>{if(page!=='brand'||!e.target.classList.contains('br-q'))return;const q=e.target.value.trim().toLowerCase();
 root.querySelectorAll('.br-t[data-n]').forEach(t=>t.hidden=q&&!t.dataset.n.includes(q))});
root.addEventListener('click',e=>{if(page!=='brand')return;const z=e.target.closest('.br-az button');if(!z)return;
 root.querySelectorAll('.br-az button').forEach(x=>x.classList.toggle('on',x===z));root.querySelectorAll('.br-t[data-n]').forEach(t=>t.hidden=z.dataset.l&&t.dataset.n[0].toUpperCase()!==z.dataset.l)});

/* ---------- FAVOURITES ---------- */
let fsort=0;
function fav(){let v=S.get('fav').map(item).reverse();
 if(!v.length){root.innerHTML=head('heart',T.fav,'')+empty('heart',T.emptyFav,T.emptyFavP);return}
 if(fsort===1)v.sort((a,b)=>a.p-b.p);if(fsort===2)v.sort((a,b)=>b.p-a.p);
 const sum=v.reduce((s,x)=>s+x.p,0);
 root.innerHTML=head('heart',T.fav,`${v.length} ${T.items} · ${T.favTotal} ${fmt(sum)}`,
  `<div class="sp-seg">${[T.sAdded,T.sCheap,T.sExp].map((t,i)=>`<button data-s="${i}" class="${i===fsort?'on':''}">${t}</button>`).join('')}</div><button class="sp-b p" id="spAll">${ic('cart')}${T.allCart}</button>`)+
 `<div class="sp-fgrid">${v.map((x,i)=>{const inC=S.has('cart',x.id),cm=S.has('cmp',x.id);
  return `<div class="sp-card sp-f" data-id="${x.id}" style="animation-delay:${i*45}ms">${x.o?`<span class="drop">${T.drop} ${fmt(x.o-x.p)}</span>`:''}
   <button class="ht" aria-label="${T.del}">${ic('heart')}</button><button class="cb${cm?' on':''}" aria-label="${T.cmp}">${ic('cmp')}</button>
   <div class="im"><img src="${x.img}" alt=""></div><span class="sp-ok">● ${T.inStock}</span><h4>${x.t}</h4><div class="sp">${x.spec}</div>
   <div class="pr"><div>${x.o?`<s>${fmt(x.o)}</s>`:''}<b>${fmt(x.p)}</b></div><button class="add${inC?' in':''}" aria-label="${T.cart}" title="${inC?T.inCart:T.cart}">${ic(inC?'sp-check':'cart')}</button></div></div>`}).join('')}</div>`}
root.addEventListener('click',e=>{if(page!=='favorites')return;const s=e.target.closest('[data-s]');if(s){fsort=+s.dataset.s;render();return}
 if(e.target.closest('#spAll')){S.get('fav').forEach(x=>{if(!S.has('cart',x.id))S.add('cart',{id:x.id,t:x.t,img:x.img,p:x.p,spec:x.spec})});S.toast(T.addedAll,T.cart,()=>location.href=S.URL.cart);return}
 if(e.target.closest('#spShare')){const u=location.origin+location.pathname+'?ids='+S.get('fav').map(x=>x.id).join(',');(navigator.clipboard?.writeText(u)||Promise.reject()).then(()=>S.toast(T.copied),()=>prompt(T.share,u));return}
 const c=e.target.closest('.sp-f');if(!c)return;const id=c.dataset.id,x=item({id});
 if(e.target.closest('.ht')){const v=S.get('fav'),i=v.findIndex(y=>y.id===id),gone=v[i];c.classList.add('out');
  setTimeout(()=>{v.splice(i,1);S.set('fav',v);S.toast(T.removed,T.undo,()=>{const w=S.get('fav');w.splice(i,0,gone);S.set('fav',w)})},230);return}
 if(e.target.closest('.cb')){S.toggle('cmp',{id,t:x.t,img:x.img,p:x.p,spec:x.spec});return}
 if(e.target.closest('.add')){if(!S.has('cart',id))S.add('cart',{id,t:x.t,img:x.img,p:x.p,spec:x.spec});else location.href=S.URL.cart;return}
 if(e.ctrlKey||e.metaKey)open('/product.html','_blank');else location.href='/product.html'});
/* shared link: ?ids=a,b,c opens someone's list */
if(page==='favorites'){const ids=new URLSearchParams(location.search).get('ids');if(ids){S.set('fav',ids.split(',').filter(Boolean).map(id=>({id})));history.replaceState(null,'',location.pathname)}}

/* ---------- COMPARE ---------- */
let only=false;
const ROWS=[['sMain',[['price',x=>x.p,'min',fmt],['score',x=>x.s?.score,'max',v=>`<div class="sp-score">${Array.from({length:10},(_,i)=>`<i class="${i<v?'f':''}"></i>`).join('')}<b style="margin-left:6px">${v}</b></div>`],['warranty',x=>x.s?.warranty,'max',v=>`${v} ${T.mon}`]]],
 ['sPerf',[['cpu',x=>x.s?.cpu],['ram',x=>x.s?.ram,'max',v=>`${v} GB`],['ssd',x=>x.s?.ssd,'max',v=>v>=1024?`${v/1024} TB SSD`:`${v} GB SSD`],['gpu',x=>x.s?.gpu]]],
 ['sBody',[['screen',x=>x.s?.screen],['weight',x=>x.s?.weight,'min',v=>`${String(v).replace('.',',')} ${T.kg}`],['battery',x=>x.s?.battery,'max',v=>`${v} Wh`],['os',x=>x.s?.os]]]];
function cmp(){const v=S.get('cmp').map(item);
 if(!v.length){root.innerHTML=head('cmp',T.cmp,'')+empty('cmp',T.emptyCmp,T.emptyCmpP);return}
 const slots=Math.max(v.length+(v.length<4?1:0),3);
 root.innerHTML=head('cmp',T.cmp,`${T.laptops}: ${v.length} ${T.items}`,`<label class="sp-sw"><input type="checkbox" id="spOnly"${only?' checked':''}><i></i>${T.only}</label><button class="sp-b" id="spClr">${ic('sp-trash')}${T.clear}</button>`)+
 `<div class="sp-card sp-cmpw"><table class="sp-ct${only?' only':''}"><colgroup><col class="lab">${Array.from({length:slots},()=>'<col>').join('')}</colgroup>
 <thead><tr><th></th>${v.map((x,i)=>{const inC=S.has('cart',x.id);return `<td><div class="sp-pc" data-id="${x.id}" style="animation-delay:${i*60}ms"><button class="x" aria-label="${T.del}">✕</button><a class="im" href="/product.html"><img src="${x.img}" alt=""></a><h4><a href="/product.html">${x.t}</a></h4><div class="row"><div>${x.o?`<s style="font-size:12px;color:var(--muted)">${fmt(x.o)}</s><br>`:''}<b>${fmt(x.p)}</b></div><button class="add${inC?' in':''}" aria-label="${T.cart}">${ic(inC?'sp-check':'cart')}</button></div></div></td>`}).join('')}
  ${v.length<slots?Array.from({length:slots-v.length},(_,i)=>`<td>${i===0&&v.length<4?`<a class="sp-slot" href="/category.html"><div><span>+</span>${T.addP}</div></a>`:''}</td>`).join(''):''}</tr></thead>
 <tbody>${ROWS.map(([sec,rows])=>`<tr class="sec"><th>${T[sec]}</th><td colspan="${slots}"></td></tr>`+rows.map(([k,get,dir,f])=>{const vals=v.map(get),def=vals.filter(x=>x!=null);
   const same=new Set(vals.map(String)).size<=1,best=dir&&def.length>1&&!same?(dir==='min'?Math.min(...def):Math.max(...def)):null;
   return `<tr class="${same?'same':'diff'}"><th>${T[k]}</th>${vals.map(x=>`<td class="${best!=null&&x===best?'best':''}">${x==null?'—':(f?f(x):x)}</td>`).join('')}${'<td></td>'.repeat(slots-v.length)}</tr>`}).join('')).join('')}</tbody></table></div>
 <div class="sp-leg"><span><b>★</b> — ${T.best}</span><span>▮ ${T.diffL}</span></div>`}
root.addEventListener('click',e=>{if(page!=='compare')return;
 if(e.target.closest('#spClr')){const was=S.get('cmp');S.set('cmp',[]);S.toast(T.cleared,T.undo,()=>S.set('cmp',was));return}
 const c=e.target.closest('.sp-pc');if(!c)return;const id=c.dataset.id;
 if(e.target.closest('.x')){const was=S.get('cmp');S.remove('cmp',id);S.toast(T.removed,T.undo,()=>S.set('cmp',was));return}
 if(e.target.closest('.add')){e.preventDefault();if(!S.has('cart',id)){const x=item({id});S.add('cart',{id,t:x.t,img:x.img,p:x.p,spec:x.spec})}else location.href=S.URL.cart}});
root.addEventListener('change',e=>{if(e.target.id==='spOnly'){only=e.target.checked;root.querySelector('.sp-ct').classList.toggle('only',only)}});

const R={cart,favorites:fav,compare:cmp,checkout,search,brand};
function render(){R[page]()}
S.subscribe(()=>render());
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setTimeout(render)));
addEventListener('storage',render);
render();
})();
</script>
