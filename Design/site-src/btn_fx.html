<!--btn-fx--><style>
/* Button hover system — same language as the "Catalog" button: gradient wake, light sweep, glow, lift.
   Primary (filled blue) buttons get the full effect + cursor spotlight + magnetic pull; secondary ones a light version. */
.fx{isolation:isolate;overflow:hidden;transition:box-shadow .3s,border-color .25s,color .25s,background-color .25s,translate .25s cubic-bezier(.2,.8,.2,1)!important}
.fx>.fx-g,.fx>.fx-sh,.fx>.fx-r{position:absolute;pointer-events:none}
.fx>.fx-g{inset:0;z-index:-1;opacity:0;transition:opacity .3s;border-radius:inherit}
.fx-p>.fx-g{background:radial-gradient(140px circle at var(--fx-x,50%) var(--fx-y,50%),rgba(255,255,255,.35),transparent 60%),linear-gradient(110deg,var(--blue-600),#4F8EF7,var(--blue-700))}
.fx-s>.fx-g{background:radial-gradient(120px circle at var(--fx-x,50%) var(--fx-y,50%),rgba(47,127,234,.16),transparent 65%)}
.fx>.fx-sh{top:0;bottom:0;width:45%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);z-index:1}
.fx-s>.fx-sh{background:linear-gradient(100deg,transparent,rgba(47,127,234,.14),transparent)}
.fx:hover>.fx-g{opacity:1}
.fx:hover>.fx-sh{animation:fxShine .8s ease}
.fx-p:hover{box-shadow:0 10px 26px rgba(20,104,220,.42);translate:var(--fx-tx,0px) calc(var(--fx-ty,0px) - 2px)}
.fx-s:hover{border-color:var(--blue-600);color:var(--blue-700);box-shadow:0 6px 18px rgba(16,27,47,.08);translate:0 -1px}
.fx:active{translate:var(--fx-tx,0px) 0;transition-duration:.08s!important}
.fx svg.i{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.fx:hover svg.i{transform:scale(1.12) rotate(-6deg)}
.fx:hover svg.i:has(use[href="#arrow"]),.fx:hover svg.i:has(use[href="#chev"]){transform:translateX(3px)}
.fx>.fx-r{border-radius:50%;width:12px;height:12px;margin:-6px 0 0 -6px;background:rgba(255,255,255,.55);animation:fxRip .6s ease-out forwards;z-index:0}
.fx-s>.fx-r{background:rgba(47,127,234,.25)}
@keyframes fxShine{to{left:130%}}
@keyframes fxRip{to{transform:scale(28);opacity:0}}
/* header icons: little bounce + count pulse */
.acts .act svg.i{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.acts .act:hover svg.i{transform:translateY(-3px) scale(1.1)}
.acts .act:hover em{animation:fxPop .4s ease}
@keyframes fxPop{50%{transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){.fx:hover>.fx-sh,.fx>.fx-r{animation:none;display:none}.fx:hover,.fx:hover svg.i,.acts .act:hover svg.i{translate:none;transform:none}}
.stage .nav.fx:hover{translate:0 -1px;transform:translateY(-50%) scale(1.08)}
.stage .nav.fx:hover svg.i{transform:none}
</style><script>
(function(){
const P='.bsum button,.search button,.btn.p,.addc,.sp-b.p,.asm-b.p,.add,.prod .cart,.loadmore,#sAdd,.mi-act .det';
const S='.btn:not(.p),.sp-b:not(.p),.asm-b:not(.p),.cmpb,.morebtn,.oneclick,.sec-act button,.sb,.sl-arr,.sp-seg button:not(.on),.stage .nav,.sp-qty button,.asm-q button,.asm-row .x,.sp-f .ht,.sp-f .cb,.sp-pc .x,.sp-promo button,.view button:not(.on),.fbtn,.tf,.rm:not(.sp-del)';
const skip=el=>el.closest('#stubs,.catbtn,.fab,.lang')||el.classList.contains('catbtn');
function prep(el){if(el._fx||skip(el))return null;const pri=el.matches(P);if(!pri&&!el.matches(S))return null;el._fx=1;
 if(getComputedStyle(el).position==='static')el.style.position='relative';
 el.classList.add('fx',pri?'fx-p':'fx-s');el.insertAdjacentHTML('beforeend','<span class="fx-g"></span><span class="fx-sh"></span>');return el}
const big=el=>el.offsetWidth>90;
document.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const el=e.target.closest&&e.target.closest('button,a');if(el)prep(el)});
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const el=e.target.closest&&e.target.closest('.fx');if(!el)return;const r=el.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 el.style.setProperty('--fx-x',x+'px');el.style.setProperty('--fx-y',y+'px');
 if(el.classList.contains('fx-p')&&big(el)){el.style.setProperty('--fx-tx',((x/r.width-.5)*3).toFixed(1)+'px');el.style.setProperty('--fx-ty',((y/r.height-.5)*2).toFixed(1)+'px')}},{passive:true});
document.addEventListener('pointerout',e=>{const el=e.target.closest&&e.target.closest('.fx');if(el&&!el.contains(e.relatedTarget)){el.style.removeProperty('--fx-tx');el.style.removeProperty('--fx-ty')}});
document.addEventListener('pointerdown',e=>{const el=e.target.closest&&(e.target.closest('.fx')||prep(e.target.closest('button,a')||document.body));if(!el||!el.classList)return;
 const r=el.getBoundingClientRect(),s=document.createElement('span');s.className='fx-r';s.style.left=e.clientX-r.left+'px';s.style.top=e.clientY-r.top+'px';el.appendChild(s);setTimeout(()=>s.remove(),650)});
})();
</script><!--/btn-fx-->
