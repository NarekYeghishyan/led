  /* [ru, hy, en] */
  const T={credit:["Рассрочка","Ապառիկ","Instalments"],about:["О нас","Մեր մասին","About us"],help:["Помощь","Օգնություն","Help"],
    buy:["Как купить","Ինչպես գնել","How to buy"],order:["Как заказать","Ինչպես պատվիրել","How to order"],pay:["Как оплатить","Ինչպես վճարել","How to pay"],
    delivery:["Доставка","Առաքում","Delivery"],warranty:["Гарантия","Երաշխիք","Warranty"],exchange:["Обмен и возврат","Փոխանակում","Exchange & returns"],
    contacts:["Контакты","Կոնտակտներ","Contacts"],register:["Регистрация","Գրանցում","Registration"],login:["Вход","Մուտք","Log in"],account:["Личный кабинет","Անձնական էջ","My account"],forgot:["Восстановление пароля","Գաղտնաբառի վերականգնում","Password recovery"],track:["Отследить заказ","Պատվերի կարգավիճակ","Track order"],home:["Главная","Գլխավոր","Home"],info:["Покупателям","Գնորդներին","Customers"],
    q:["Остались вопросы?","Հարցեր ունե՞ք","Have a question?"],qd:["Пн–Сб 10:30–19:30","Երկ–Շբթ 10:30–19:30","Mon–Sat 10:30–19:30"]};
  const P={credit:"/credit.html",about:"/about.html",buy:"/how-to-buy.html",order:"/how-to-order.html",pay:"/how-to-pay.html",delivery:"/delivery.html",warranty:"/warranty.html",exchange:"/exchange.html",contacts:"/contacts.html",register:"/registration.html",login:"/login.html",account:"/account.html",forgot:"/forgot-password.html",track:"/track-order.html"};
  const IC={credit:"#card",about:"#store",buy:"#cart",order:"#ix-box",pay:"#ix-wallet",delivery:"#truck",warranty:"#shield",exchange:"#ix-ref",contacts:"#pin",register:"#user",login:"#shield",account:"#user",forgot:"#shield",track:"#truck"};
  const HELP=["buy","order","track","pay","delivery","warranty","exchange"];
  const here=(location.pathname.split('/').pop()||'').replace('.html','');
  const cur=Object.keys(P).find(k=>P[k]==='/'+here+'.html');
  const t=k=>{const i={hy:1,en:2}[document.documentElement.lang]||0;return (T[k]||[k])[i];};
  const ic=(h)=>`<svg class="i"><use href="${h}"/></svg>`;

  /* top bar */
  const old=document.querySelector('.top .wrap a.hide');
  if(old&&!document.querySelector('.top .hlp')){
    const box=document.createElement('span');box.style.cssText='display:contents';
    box.innerHTML=`<a class="tl cr" data-k="credit" href="${P.credit}"></a><a class="tl" data-k="about" href="${P.about}"></a>`+
      `<div class="hlp"><a class="tl" data-k="help" tabindex="0" role="button" aria-haspopup="true"></a><div class="hlp-m">`+
      HELP.map(k=>`<a href="${P[k]}" data-k="${k}">${ic(IC[k])}<span></span></a>`).join('')+`</div></div>`+
      `<a class="tl" data-k="contacts" href="${P.contacts}"></a>`;
    old.parentNode.insertBefore(box,old);
    document.querySelectorAll('.top .wrap > a.hide').forEach(a=>a.remove());
    const h=box.querySelector('.hlp');
    h.firstElementChild.addEventListener('click',e=>{e.preventDefault();h.classList.toggle('open');});
    document.addEventListener('click',e=>{if(!h.contains(e.target))h.classList.remove('open');});
    box.querySelectorAll('[data-k]').forEach(a=>{if(a.dataset.k===cur||(a.dataset.k==='help'&&HELP.includes(cur)))a.classList.add('on');});
  }
  /* footer "Покупателям" list → links */
  const FT={"Как заказать":"order","Доставка и оплата":"delivery","Рассрочка":"credit","Гарантия и возврат":"warranty"};
  document.querySelectorAll('footer li').forEach(li=>{
    const k=Object.keys(FT).find(x=>li.textContent.trim()===x||li.dataset.ft===x);
    if(k&&!li.querySelector('a')){li.dataset.ft=k;const a=document.createElement('a');a.href=P[FT[k]];a.style.cssText='color:inherit;text-decoration:none';while(li.firstChild)a.appendChild(li.firstChild);li.appendChild(a);}
  });
  /* link map leftovers that still point to the old site */
  const OLD={"help_up_menu/warranty":"warranty","help_up_menu/delivery":"delivery","help_up_menu/how_order":"buy","help_up_menu/how_pay":"pay","help_up_menu/change":"exchange","contacts":"contacts","about":"about","credit_sale":"credit","users/registration":"register","users/forgot":"forgot"};
  const fix=()=>document.querySelectorAll('a[href*="led.am/"]').forEach(a=>{const m=a.href.match(/led\.am\/(?:ru|am|en)\/(.+?)\.html/);if(m&&OLD[m[1]])a.href=P[OLD[m[1]]];});
  fix();setTimeout(fix,600);

  /* info page chrome */
  const nav=document.getElementById('ipNav');
  if(nav){
    const main=["credit","about"],rest=["contacts","login","register"];
    const item=k=>`<a href="${P[k]}" data-k="${k}"${k===cur?' class="on" aria-current="page"':''}>${ic(IC[k])}<span></span></a>`;
    nav.innerHTML=`<div class="ip-menu"><h6 data-k="info"></h6>${main.map(item).join('')}<hr><h6 data-k="help"></h6>${HELP.map(item).join('')}<hr>${rest.map(item).join('')}</div>`+
      `<div class="ip-call"><b data-k="q"></b><a href="tel:+37410502802">${ic('#call')}010 502‑802</a><a href="tel:+37499502802">${ic('#call')}099 502‑802</a><small data-k="qd"></small></div>`;
    const cr=document.getElementById('ipCrumb');
    if(cr)cr.innerHTML=`<a href="/" data-k="home"></a><span>/</span>`+(HELP.includes(cur)?`<a href="${P.buy}" data-k="help"></a><span>/</span>`:'')+`<b data-k="${cur}"></b>`;
  }
  const paint=()=>{document.querySelectorAll('[data-k]').forEach(e=>{const s=e.querySelector(':scope>span:not(.fx-g):not(.fx-sh)');const tx=t(e.dataset.k);
      if(e.classList.contains('tl')&&e.dataset.k==='help'){e.innerHTML=tx+'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>';}
      else if(s)s.textContent=tx;else e.textContent=tx;});};
  const retitle=()=>{const v=[...document.querySelectorAll('.ipl')].find(x=>getComputedStyle(x).display!=='none');if(v)document.title=v.dataset.title;};
  paint();retitle();
  new MutationObserver(()=>{paint();retitle();}).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});

  /* contact forms (one per language) */
  /* header "Кабинет" → registration */
  document.querySelectorAll('header a.act').forEach(a=>{if(a.querySelector('use[href="#user"]'))a.href=P.login;});
  /* registration: customer type shows dealer / company fields */
  document.querySelectorAll('.ip-form.rg').forEach(f=>{const sel=f.querySelector('.rg-type');
    const sync=()=>f.querySelectorAll('.rg-g').forEach(g=>{const on=g.dataset.t===sel.value;g.hidden=!on;g.querySelectorAll('input').forEach(x=>x.disabled=!on);});
    sel.addEventListener('change',sync);sync();
});
  if(document.querySelector('.lg-w')&&location.hash==='#forgot')location.replace(P.forgot);
  window.LEDInfoForm=f=>{if(f.dataset.v)return;f.dataset.v=1;f.addEventListener('submit',e=>{e.preventDefault();let ok=true;
    const mis=f.querySelector('.rg-mis');let mm=false;
    f.querySelectorAll('[data-same]').forEach(x=>{const o=f.querySelector(`[name="${x.dataset.same}"]`);const bad=x.value!==o.value;if(bad&&x.value){x.classList.add('bad');ok=false;mm=true;}});
    if(mis){mis.hidden=!mm;mis.textContent=mm?mis.dataset.mis:'';}
    f.querySelectorAll('[required]:not(:disabled)').forEach(x=>{if(x.closest('[hidden]'))return;const bad=!x.value.trim()||(x.minLength>0&&x.value.trim().length<x.minLength)||(x.type==='email'&&!/^\S+@\S+\.\S+$/.test(x.value));if(bad||!x.dataset.same||x.value===f.querySelector(`[name="${x.dataset.same}"]`).value)x.classList.toggle('bad',bad);if(bad)ok=false;});
    if(!ok)return;const data=Object.fromEntries(new FormData(f));f.dispatchEvent(new CustomEvent('ok',{detail:data}));if(f.dataset.api)return;f.reset();f.querySelectorAll('.rg-type').forEach(x=>x.dispatchEvent(new Event('change')));const m=f.querySelector('.ip-ok');m.classList.add('on');setTimeout(()=>m.classList.remove('on'),5000);});};
  document.querySelectorAll('.ip-form').forEach(f=>LEDInfoForm(f));

  window.LEDInfoToast=null;
  /* login, registration, password reset, header "Кабинет": site-src/auth.html (real /api/shop) */
})();
</script>
