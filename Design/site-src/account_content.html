  .ac-stats .ic{width:34px;height:34px;margin:0}
  .ac-stats b{font-size:20px}
  .ac-stats small{flex:1 1 100%;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ac-flt{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px 4px;padding:0 16px 4px}
  .ac-flt::-webkit-scrollbar{display:none}
  .ac-flt button{flex:none;white-space:nowrap}
  .ac-oh{grid-template-columns:minmax(0,1fr) auto 20px;grid-template-areas:"n st c" "n sum c";gap:4px 10px;padding:12px}

  .ac-tl{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .ac-tl span{flex:none;white-space:nowrap}
  .ac-oa .btn{flex:1 1 0;justify-content:center;text-align:center}
  .ac-adr{grid-template-columns:1fr}

  .ac-gate{padding:28px 16px}

.ac-noimg{width:48px;height:48px;border-radius:10px;background:var(--blue-50);color:var(--blue-600);display:grid;place-items:center;flex:none}.ac-noimg .i{width:22px;height:22px}
.ac-imp{display:flex;align-items:center;gap:10px;background:#FFF7E6;border:1px solid #F5DDA6;color:#8A5A00;border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px}.ac-imp .i{width:18px;height:18px;flex:none}.ac-imp a{margin-left:auto;color:#8A5A00;font-weight:600}
.ac-hint{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:4px}
.ac-fill{margin:12px 0 0;font-size:14px}.ac-fill a{color:var(--blue-600)}
.ac-prof select{width:100%}
</style>

      const M=[['ov','grid'],['orders','ix-box'],['profile','user'],['adr','pin'],['pwd','shield']];
      nav.classList.add('ac-nav');
      nav.innerHTML=`<div class="ip-menu"><div class="ac-who"><span class="ac-av">${ini}</span><div><b>${esc(who)}</b><small>${esc(u.name?u.phone||u.email||'':u.email||'')}</small>${ti>0?`<br><span class="ac-tag">${tt(T.types[ti])}</span>`:''}</div></div>`+
        `<div class="ac-tabs">`+M.map(([k,i])=>`<a href="#${k}" data-s="${k}"${k===sec?' class="on"':''}>${ic(i)}<span>${t(k)}</span></a>`).join('')+`</div>`+
        `<hr><a href="/favorites">${ic('heart')}<span>${t('fav')}</span></a><a href="/compare">${ic('cmp')}<span>${t('cmp')}</span></a><a href="/cart">${ic('cart')}<span>${t('cart')}</span></a>`+
        `<hr><a href="#" class="ac-out">${ic('arrow')}<span>${t('out')}</span></a></div>`;
      const S=window.LEDStore, c=k=>S?S.count(k):0;
      const orderHTML=o=>`<div class="ac-ord" data-n="${esc(o.n)}"><button class="ac-oh" type="button"><div><b>${t('order')} № ${esc(o.n)}</b><small>${dfmt(o.d)}</small></div>
        <div class="sm"><small>${o.it.reduce((a,x)=>a+x.q,0)} ${t('items')}</small></div><span class="ac-st s${o.s}">${tt(T.st[o.s])}</span><b>${fmt(o.tot,o.cur)}</b><svg class="chv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="ac-ob">${o.it.map(x=>`<div class="ac-it"><span class="ac-noimg">${ic('ix-box')}</span><div>${esc(x.nm)}<br><small>${x.art?esc(x.art)+' · ':''}${x.q} × ${fmt(x.p,o.cur)}</small></div><b>${fmt(x.tot,o.cur)}</b></div>`).join('')}
        ${o.ship&&o.shipCost?`<div class="ac-it"><span class="ac-noimg">${ic('pin')}</span><div>${t('ship')}</div><b>${fmt(o.shipCost,o.cur)}</b></div>`:''}
        <div class="ac-tl">${T.st.map((s,i)=>`<span class="${i<=o.s?'on':''}">${tt(s)}</span>`).join('')}</div>
        <small style="color:var(--muted)">${o.pay?`${t('pay')}: ${esc(PAY[o.pay]?tt(PAY[o.pay]):o.pay)}${o.paid?' ('+t('paid')+')':''} · `:''}${t('dlv')}: ${esc(o.dl())}</small></div></div>`;
      const adrs=Array.isArray(u.addresses)?u.addresses:[];
      const shown=ORD.filter(o=>flt<0||o.s===flt);
      const F=(n,l,v,o={})=>`<label${o.w?' class="w"':''}>${l}${o.req?' *':''}<input name="${n}" type="${o.ty||'text'}" value="${esc(v)}"${o.req?' required minlength="'+(o.min||2)+'"':''}${o.ty==='tel'?' inputmode="tel" autocomplete="tel"':''}${o.ac?` autocomplete="${o.ac}"`:''}>${o.hint?`<small class="ac-hint">${o.hint}</small>`:''}</label>`;
      const since=(u.registeredAt||u.createdAt||'').slice(0,4);
      app.innerHTML=(u.adminView?`<div class="ac-imp">${ic('shield')}<span>${t('imp')} <b>${esc(u.adminView)}</b></span><a href="#" class="ac-imp-x">${t('impX')}</a></div>`:'')+
      `<section class="ac-sec${sec==='ov'?' on':''}" data-s="ov">
        <div class="ip-card"><h2><span class="ic">${ic('user')}</span>${t('hi')}${u.name?', '+esc(u.name.split(' ')[0]):''}!</h2>
        <p style="margin:0;color:var(--muted)">${since?`${t('since')} ${since}`:''}</p>
        ${!u.name||!u.email?`<p class="ac-fill"><a href="#profile" data-s="profile">${t('fill')}</a></p>`:''}</div>
        <div class="ac-stats" style="margin-top:18px">
          <a href="#orders" data-s="orders"><span class="ic">${ic('ix-box')}</span><b>${ORD.length||u.orderCount||0}</b><small>${t('orders')}</small></a>
          <a href="/favorites"><span class="ic">${ic('heart')}</span><b>${c('fav')}</b><small>${t('fav')}</small></a>
          <a href="/compare"><span class="ic">${ic('cmp')}</span><b>${c('cmp')}</b><small>${t('cmp')}</small></a>
          <a href="/cart"><span class="ic">${ic('cart')}</span><b>${c('cart')}</b><small>${t('cart')}</small></a></div>
        <div class="ip-card" style="margin-top:18px"><h2 style="justify-content:space-between"><span style="display:flex;gap:12px;align-items:center"><span class="ic">${ic('ix-box')}</span>${t('recent')}</span>${ORD.length>2?`<a href="#orders" data-s="orders" style="font-size:14px;color:var(--blue-600)">${t('all')}</a>`:''}</h2>${ORD.length?ORD.slice(0,2).map(orderHTML).join(''):`<div class="ac-empty">${t('none')}</div>`}</div>
      </section>
      <section class="ac-sec${sec==='orders'?' on':''}" data-s="orders"><div class="ip-card"><h2><span class="ic">${ic('ix-box')}</span>${t('orders')}</h2>
        <div class="ac-flt">${[-1,0,1,2].map(i=>`<button type="button" data-f="${i}" class="${i===flt?'on':''}">${i<0?t('stAll'):tt(T.st[i])}</button>`).join('')}</div>
        ${shown.length?shown.map(orderHTML).join(''):`<div class="ac-empty">${t('none')}</div>`}</div></section>
      <section class="ac-sec${sec==='profile'?' on':''}" data-s="profile"><div class="ip-card"><h2><span class="ic">${ic('user')}</span>${t('profile')}</h2>
        <form class="ip-form ac-prof" data-api="profile" novalidate>${F('name',t('fname'),u.name,{w:1,ac:'name'})}${F('phone',t('phone'),u.phone,{ty:'tel',req:1,min:8})}
        ${F('email',t('email'),u.email,{ty:'email',ac:'email',hint:t('emailH')})}
        <label>${t('loc')}${regionSel('city',u.city)}</label>${F('address',t('street'),u.address,{ac:'street-address'})}
        <label class="w">${t('type')}<input value="${tt(T.types[ti])}" disabled><small class="ac-hint">${t('typeH')}</small></label>
        ${ti===1?F('company',t('company'),u.company,{w:1,ac:'organization'}):''}
        ${ti===2?F('lawName',t('company'),u.lawName||u.company,{w:1,ac:'organization'})+F('taxcode',t('tax'),u.taxcode)+F('bankinfo',t('bank'),u.bankinfo)+F('lawAddress',t('lawAdr'),u.lawAddress,{w:1})+F('factualAddress',t('factAdr'),u.factualAddress,{w:1}):''}
        <div class="au-err w" hidden></div>
        <div class="row"><small>${t('req')}</small><span class="ip-ok"><svg class="i"><use href="#check"/></svg>${t('saved')}</span><button class="btn p" type="submit" style="border:0;font:inherit;font-weight:600;cursor:pointer">${t('save')}</button></div></form></div></section>
      <section class="ac-sec${sec==='adr'?' on':''}" data-s="adr"><div class="ip-card"><h2><span class="ic">${ic('pin')}</span>${t('adr')}</h2>
        ${adrEdit!==null?`<form class="ip-form ac-af" novalidate>${F('l',t('aname'),(adrs[adrEdit]||{}).l,{w:1,req:1})}${F('city',t('city'),(adrs[adrEdit]||{}).city||(u.city&&A?A.regionName(u.city):''),{req:1})}${F('a',t('street'),(adrs[adrEdit]||{}).a,{req:1})}
          <div class="au-err w" hidden></div><div class="row"><a href="#" class="ac-ac lg-sw">${t('cancel')}</a><button class="btn p" type="submit" style="border:0;font:inherit;font-weight:600;cursor:pointer">${t('save')}</button></div></form>`:
        `<div class="ac-adr">${adrs.map((a,i)=>`<div class="${a.def?'def':''}"><b>${esc(a.l)}${a.def?` <span class="ac-tag">${t('def')}</span>`:''}</b><p>${esc(a.city)}, ${esc(a.a)}</p><div class="acts"><a data-e="${i}">${t('edit')}</a>${a.def?'':`<a data-d="${i}">${t('mkdef')}</a>`}<a class="del" data-x="${i}">${t('del')}</a></div></div>`).join('')}<div class="new" data-e="${adrs.length}">${t('add')}</div></div>`}</div></section>
      <section class="ac-sec${sec==='pwd'?' on':''}" data-s="pwd"><div class="ip-card"><h2><span class="ic">${ic('shield')}</span>${t('pwd')}</h2>
        <form class="ip-form ac-pw" data-api="password" novalidate><label class="w">${t('oldp')} *<input name="old" type="password" required minlength="1" autocomplete="current-password"></label>
        <label>${t('newp')} *<input name="password" type="password" required minlength="6" autocomplete="new-password"></label><label>${t('rep')} *<input name="re_password" type="password" required minlength="6" data-same="password" autocomplete="new-password"></label>
        <div class="au-err w" hidden></div>
        <div class="row"><small>${t('req')}</small><span class="ip-ok"><svg class="i"><use href="#check"/></svg>${t('pwdOk')}</span><button class="btn p" type="submit" style="border:0;font:inherit;font-weight:600;cursor:pointer">${t('save')}</button></div>
        <div class="row rg-mis" hidden data-mis="${t('mis')}"></div></form>
        <hr style="border:0;border-top:1px solid var(--line);margin:22px 0 16px"><p style="margin:0 0 12px;color:var(--muted);font-size:14px">${t('sessP')}</p>
        <button class="btn ac-all" type="button" style="font:inherit;font-weight:600;cursor:pointer">${t('sess')}</button></div></section>`;
      /* wiring */
      const go=s=>{sec=s;adrEdit=null;history.replaceState(null,'','#'+s);render();scrollTo({top:0,behavior:'smooth'});};
      document.querySelectorAll('[data-s]').forEach(a=>{if(a.tagName==='A')a.onclick=e=>{e.preventDefault();go(a.dataset.s);};});
      const ix=app.querySelector('.ac-imp-x');if(ix)ix.onclick=e=>{e.preventDefault();A.logout().finally(()=>location.href='/admin/customers');};
      nav.querySelector('.ac-out').onclick=e=>{e.preventDefault();A.logout().finally(()=>location.href='/login.html');};
      app.querySelector('.ac-all').onclick=()=>A.api('/logout-all',{method:'POST'}).catch(()=>{}).finally(()=>{A.cache(null);location.href='/login.html';});
      app.querySelectorAll('.ac-oh').forEach(b=>b.onclick=()=>b.parentNode.classList.toggle('open'));
      app.querySelectorAll('.ac-flt button').forEach(b=>b.onclick=()=>{flt=+b.dataset.f;render();});
      const ok=f=>{const m=f.querySelector('.ip-ok');if(m){m.classList.add('on');setTimeout(()=>m.classList.remove('on'),4000);}};
      const pf=app.querySelector('.ac-prof');
      A.form(pf,d=>A.api('/me',{method:'PATCH',body:d}).then(x=>{u=x;A.cache(x);ok(pf);setTimeout(render,1200);}));
      const pw=app.querySelector('.ac-pw');
      A.form(pw,d=>A.api('/me/password',{method:'POST',body:{old:d.old,password:d.password}}).then(()=>{pw.reset();ok(pw);}));
      const saveAdr=list=>A.api('/me',{method:'PATCH',body:{addresses:list}}).then(x=>{u=x;A.cache(x);adrEdit=null;render();});
      app.querySelectorAll('[data-e]').forEach(a=>a.onclick=()=>{adrEdit=+a.dataset.e;render();});
      app.querySelectorAll('[data-d]').forEach(a=>a.onclick=()=>saveAdr(adrs.map((x,i)=>({...x,def:i===+a.dataset.d?1:0}))));
      app.querySelectorAll('[data-x]').forEach(a=>a.onclick=()=>saveAdr(adrs.filter((x,i)=>i!==+a.dataset.x)));
      const af=app.querySelector('.ac-af');
      if(af){af.querySelector('.ac-ac').onclick=e=>{e.preventDefault();adrEdit=null;render();};
        af.addEventListener('submit',e=>{e.preventDefault();e.stopImmediatePropagation();let okk=true;af.querySelectorAll('[required]').forEach(x=>{const b=x.value.trim().length<2;x.classList.toggle('bad',b);if(b)okk=false;});if(!okk)return;
          const d=Object.fromEntries(new FormData(af));const list=adrs.slice();list[adrEdit]={...(list[adrEdit]||{def:list.length?0:1}),...d};
          saveAdr(list).catch(err=>A.showErr(af,err));},true);}
      app.querySelectorAll('.ip-form:not(.ac-af)').forEach(f=>window.LEDInfoForm&&window.LEDInfoForm(f));
    });
  }
  render();load();
  addEventListener('hashchange',()=>{const s=location.hash.slice(1);if(T[s]&&s!==sec){sec=s;render();}});
  new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
});
</script>

<div class="ac-app"></div>
