<!--shop-shared-->
<style>
.act.on{background:var(--blue-50);color:var(--blue-700)}.act.on svg.i{color:var(--blue-600)}
.act em.bump{animation:spBump .5s}@keyframes spBump{40%{transform:scale(1.5)}}
.sp-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--navy-900);color:#fff;border-radius:14px;padding:12px 14px 12px 18px;display:flex;align-items:center;gap:14px;z-index:60;box-shadow:0 14px 40px rgba(14,26,46,.35);transition:transform .3s;font-weight:600;font-size:14px}
.sp-toast.on{transform:translate(-50%,0)}.sp-toast a,.sp-toast button{background:var(--blue-600);color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.prod .fav.on svg.i{fill:#E5484D;color:#E5484D}
</style>
<script>/* LED shop store: cart / favourites / compare in localStorage (demo until the API exists) */
(function(){
const K={cart:'led-cart',fav:'led-fav',cmp:'led-cmp'};
const SEED={cart:[{id:'lenovo-ideapad-slim-3-15',q:1},{id:'hp-pavilion-15',q:1}],
 fav:[{id:'asus-zenbook-14-oled'},{id:'msi-thin-gf63'},{id:'lenovo-yoga-7-2-in-1-14'},{id:'dell-inspiron-14'}],
 cmp:[{id:'lenovo-ideapad-slim-3-15'},{id:'hp-pavilion-15'},{id:'asus-vivobook-16'}]};
const slug=t=>(t||'').toLowerCase().replace(/[″"]/g,'').replace(/[^a-z0-9а-яё]+/gi,'-').replace(/^-|-$/g,'');
const get=k=>{let v=null;try{v=JSON.parse(localStorage.getItem(K[k]))}catch(e){}return Array.isArray(v)?v:SEED[k].map(x=>({...x}))};
const subs=[];
const set=(k,v)=>{try{localStorage.setItem(K[k],JSON.stringify(v))}catch(e){}paint(k);subs.forEach(f=>f(k))};
const has=(k,id)=>get(k).some(x=>x.id===id);
function add(k,item){const v=get(k),i=v.findIndex(x=>x.id===item.id);
 if(i>=0){if(k==='cart')v[i].q=(v[i].q||1)+1;else return false}else v.push(k==='cart'?{q:1,...item}:item);
 if(k==='cmp'&&v.length>4)v.shift();set(k,v);return true}
const remove=(k,id)=>set(k,get(k).filter(x=>x.id!==id));
const toggle=(k,item)=>has(k,item.id)?(remove(k,item.id),false):(add(k,item),true);
const count=k=>get(k).reduce((s,x)=>s+(k==='cart'?(x.q||1):1),0);
const ICON={cart:'#cart',fav:'#heart',cmp:'#cmp'},URL={cart:'/cart.html',fav:'/favorites.html',cmp:'/compare.html'};
function act(k){return document.querySelector(`.acts .act use[href="${ICON[k]}"]`)?.closest('.act')}
function paint(k,bump=true){const a=act(k);if(!a)return;let em=a.querySelector('em');const n=count(k);
 if(!n){em&&em.remove();return}if(!em){em=document.createElement('em');a.appendChild(em)}
 if(em.textContent!=String(n)){em.textContent=n;if(bump){em.classList.remove('bump');void em.offsetWidth;em.classList.add('bump')}}}
const page=document.getElementById('shop')?.dataset.page;
Object.keys(K).forEach(k=>{const a=act(k);if(!a)return;a.href=URL[k];a.dataset.lk=1;
 if({cart:'cart',fav:'favorites',cmp:'compare'}[k]===page)a.classList.add('on');paint(k,false)});
/* toast */
let tEl,tT;function toast(msg,btn,fn){if(!tEl){tEl=document.createElement('div');tEl.className='sp-toast';document.body.appendChild(tEl)}
 tEl.innerHTML=`<span>${msg}</span>`+(btn?`<button>${btn}</button>`:'');if(btn)tEl.querySelector('button').onclick=()=>{fn&&fn();tEl.classList.remove('on')};
 requestAnimationFrame(()=>tEl.classList.add('on'));clearTimeout(tT);tT=setTimeout(()=>tEl.classList.remove('on'),4200)}
const L=()=>({hy:1,en:2}[document.documentElement.lang]||0);
const TX={added:['Добавлено в корзину','Ավելացվեց զամբյուղ','Added to cart'],go:['Перейти','Անցնել','View'],
 fav:['Добавлено в избранное','Ավելացվեց ընտրյալներում','Saved to favourites'],unfav:['Убрано из избранного','Հեռացվեց ընտրյալներից','Removed from favourites'],
 cmp:['Добавлено к сравнению','Ավելացվեց համեմատման','Added to compare'],uncmp:['Убрано из сравнения','Հեռացվեց համեմատումից','Removed from compare']};
const tx=k=>TX[k][L()];
/* product cards on home/category: read the card, store it */
function cardItem(c){const t=c.querySelector('h4')?.textContent.trim();if(!t)return null;
 return{id:slug(t),t,img:c.querySelector('.img img')?.getAttribute('src'),spec:c.querySelector('.spec')?.textContent.trim(),
  p:+(c.querySelector('.pr b')?.textContent||'').replace(/\D/g,'')||0}}
document.querySelectorAll('.prod').forEach(c=>{const it=cardItem(c);if(!it)return;
 c.querySelector('.fav')?.classList.toggle('on',has('fav',it.id))});
if(!page)document.addEventListener('click',e=>{const c=e.target.closest('.prod');if(!c)return;const it=cardItem(c);if(!it)return;
 if(e.target.closest('.cart')){e.preventDefault();add('cart',it);toast(tx('added'),tx('go'),()=>location.href=URL.cart)}
 else if(e.target.closest('.fav')){const on=toggle('fav',it);c.querySelector('.fav').classList.toggle('on',on);toast(tx(on?'fav':'unfav'),on?tx('go'):'',()=>location.href=URL.fav)}
 else if(e.target.closest('.cmpb')){const on=toggle('cmp',it);toast(tx(on?'cmp':'uncmp'),on?tx('go'):'',()=>location.href=URL.cmp)}});
window.LEDStore={get,set,add,remove,toggle,has,count,toast,slug,subscribe:f=>subs.push(f),URL};
})();
</script>
<!--/shop-shared-->
