<!--search-box-->
<style>
.pdp .brand{cursor:pointer}
.search{position:relative;overflow:visible!important}
.search>input{border-radius:var(--r-sm) 0 0 var(--r-sm);min-width:0}
.search>button{border-radius:0 calc(var(--r-sm) - 2px) calc(var(--r-sm) - 2px) 0}
.search>input::-webkit-search-cancel-button{cursor:pointer}
.sx{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(14,26,46,.18);z-index:80;overflow:hidden;display:none;max-height:min(70vh,560px);overflow-y:auto;text-align:left}
.sx.open{display:block;animation:sxIn .18s ease-out}
@keyframes sxIn{from{opacity:0;transform:translateY(-4px)}}
.sx h6{margin:0;padding:12px 16px 6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.sx h6 button{all:unset;cursor:pointer;color:var(--blue-600);text-transform:none;letter-spacing:0;font-weight:600}
.sx a{display:flex;align-items:center;gap:12px;padding:8px 16px;color:inherit;text-decoration:none;font-size:14px;cursor:pointer}
.sx a:hover,.sx a.on{background:var(--blue-50)}
.sx a img{width:42px;height:42px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff;flex:none}
.sx a .nm{flex:1;min-width:0}.sx a .nm small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sx a b{white-space:nowrap;font-size:14px}
.sx a svg{width:16px;height:16px;color:var(--muted);flex:none}
.sx mark,.sr-grid mark{background:#FFF0B3;color:inherit;border-radius:3px;padding:0 1px}
.sx .chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 12px}
.sx .chips a{padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px}
.sx .all{justify-content:center;border-top:1px solid var(--line);color:var(--blue-600);font-weight:600;padding:12px}
.sx .none{padding:16px;color:var(--muted);font-size:14px}
</style>
<script>
(function(){
  /* demo search index (until /api): [id, title, img, price, old, spec, brand, cat, stock] */
  const CATS={laptop:['Ноутбуки','Նոութբուքեր','Laptops'],pc:['Компьютеры','Համակարգիչներ','Desktops'],monitor:['Мониторы','Մոնիտորներ','Monitors'],
    parts:['Комплектующие','Համալրող սարքեր','Components'],periph:['Периферия','Համալրող պարագաներ','Peripherals'],net:['Сетевое оборудование','Ցանցային սարքեր','Networking'],
    phone:['Смартфоны и планшеты','Սմարթֆոններ և պլանշետներ','Phones & tablets'],acc:['Аксессуары','Աքսեսուարներ','Accessories']};
  /* words in RU/HY/EN that mean a category */
  const SYN={laptop:['ноутбук','нотбук','laptop','notebook','նոութբուք','նոթբուք'],pc:['компьютер','пк','pc','desktop','համակարգիչ'],monitor:['монитор','monitor','մոնիտոր','экран'],
    parts:['ssd','видеокарт','процессор','память','cpu','gpu','ram','կրիչ','պրոցեսոր','վիդեոքարտ','հիշողություն'],periph:['мыш','клавиатур','наушник','mouse','keyboard','headset','մկնիկ','ստեղնաշար','ականջակալ'],
    net:['роутер','router','wifi','wi-fi','ռոութեր','երթուղիչ'],phone:['смартфон','телефон','планшет','phone','tablet','սմարթֆոն','պլանշետ','հեռախոս'],acc:['рюкзак','сумк','заряд','кабель','backpack','charger','պայուսակ','լիցքավորիչ']};
  const I=[
    ['lenovo-ideapad-slim-3-15','Lenovo IdeaPad Slim 3 15″','img/p2.webp',289000,321000,'Core i5‑1335U · 16 ГБ · 512 ГБ SSD','Lenovo','laptop',1],
    ['lenovo-yoga-7-2-in-1-14','Lenovo Yoga 7 2‑in‑1 14″','img/p2.webp',398000,0,'Ryzen 7 · 16 ГБ · 512 ГБ SSD','Lenovo','laptop',1],
    ['hp-pavilion-15','HP Pavilion 15','img/p2.webp',412000,448000,'Core i7‑1355U · 16 ГБ · 1 ТБ SSD','HP','laptop',1],
    ['asus-vivobook-16','ASUS VivoBook 16','img/p2.webp',259000,0,'Core i5‑12500H · 8 ГБ · 512 ГБ SSD','ASUS','laptop',1],
    ['dell-inspiron-14','Dell Inspiron 14','img/p2.webp',305000,0,'Ryzen 5 7530U · 16 ГБ · 512 ГБ SSD','Dell','laptop',0],
    ['acer-nitro-v-15','Acer Nitro V 15','img/p2.webp',469000,521000,'Core i5‑13420H · RTX 4050 · 16 ГБ','Acer','laptop',1],
    ['msi-thin-gf63','MSI Thin GF63','img/p2.webp',535000,0,'Core i7‑12650H · RTX 4060 · 16 ГБ','MSI','laptop',1],
    ['lenovo-thinkpad-e14','Lenovo ThinkPad E14','img/p2.webp',372000,0,'Core i5‑1335U · 16 ГБ · 512 ГБ SSD','Lenovo','laptop',1],
    ['asus-zenbook-14-oled','ASUS Zenbook 14 OLED','img/p2.webp',589000,0,'Core Ultra 7 · 16 ГБ · 1 ТБ SSD','ASUS','laptop',1],
    ['apple-macbook-air-13-m3','Apple MacBook Air 13″ M3','img/p2.webp',629000,679000,'Apple M3 · 16 ГБ · 512 ГБ SSD','Apple','laptop',1],
    ['led-office-i5','LED Office i5','img/p4.webp',239000,0,'Core i5‑12400 · 16 ГБ · 512 ГБ SSD','LED','pc',1],
    ['led-gamer-r7-4070','LED Gamer R7 RTX 4070','img/p4.webp',849000,899000,'Ryzen 7 7700 · RTX 4070 Super · 32 ГБ','LED','pc',1],
    ['hp-pro-tower-290','HP Pro Tower 290 G9','img/p4.webp',279000,0,'Core i3‑12100 · 8 ГБ · 256 ГБ SSD','HP','pc',0],
    ['samsung-odyssey-g5-27','Samsung Odyssey G5 27″','img/p3.webp',149000,169000,'27″ QHD · 165 Гц · VA','Samsung','monitor',1],
    ['lg-ultragear-24','LG UltraGear 24GN60R 24″','img/p3.webp',89000,0,'24″ FHD · 144 Гц · IPS','LG','monitor',1],
    ['dell-p2423d','Dell P2423D 24″','img/p3.webp',119000,0,'24″ QHD · IPS · USB‑хаб','Dell','monitor',1],
    ['samsung-990-evo-1tb','SSD Samsung 990 EVO 1 ТБ','img/p1.webp',48000,0,'NVMe · PCIe 4.0','Samsung','parts',1],
    ['kingston-fury-ddr5-16','Kingston FURY Beast 16 ГБ DDR5','img/p1.webp',26000,29000,'DDR5‑5600 · CL40','Kingston','parts',1],
    ['msi-rtx-4060-ventus','MSI GeForce RTX 4060 Ventus 2X 8 ГБ','img/p1.webp',159000,0,'8 ГБ GDDR6 · DLSS 3','MSI','parts',1],
    ['amd-ryzen-5-7600','AMD Ryzen 5 7600','img/p1.webp',89000,0,'AM5 · 6 ядер · 5.1 ГГц','AMD','parts',1],
    ['logitech-mx-master-3s','Logitech MX Master 3S','img/p5.webp',52000,0,'Мышь · Bluetooth','Logitech','periph',1],
    ['logitech-mx-keys-s','Logitech MX Keys S','img/p5.webp',59000,0,'Клавиатура · подсветка','Logitech','periph',1],
    ['hyperx-cloud-ii','HyperX Cloud II','img/p5.webp',39000,45000,'Наушники · 7.1','HyperX','periph',1],
    ['tp-link-archer-ax55','TP‑Link Archer AX55','img/p1.webp',34000,0,'Роутер Wi‑Fi 6 · AX3000','TP-Link','net',1],
    ['mikrotik-hap-ax2','MikroTik hAP ax²','img/p1.webp',42000,0,'Роутер Wi‑Fi 6 · 5 портов','MikroTik','net',0],
    ['xiaomi-redmi-pad-se','Xiaomi Redmi Pad SE','img/p1.webp',99000,0,'Планшет 11″ · 8/256 ГБ','Xiaomi','phone',1],
    ['samsung-galaxy-a55','Samsung Galaxy A55','img/p1.webp',189000,209000,'Смартфон · 8/256 ГБ','Samsung','phone',1],
    ['hp-renew-backpack-15','Рюкзак HP Renew 15.6″','img/p1.webp',24000,0,'Рюкзак · водоотталкивающий','HP','acc',1],
    ['ugreen-nexode-100w','Ugreen Nexode 100W','img/p1.webp',21000,0,'Зарядка USB‑C · GaN','Ugreen','acc',1]
  ].map(([id,t,img,p,o,spec,brand,cat,stock])=>({id,t,img,p,o,spec,brand,cat,stock:!!stock}));
  const POP=['ноутбук','RTX 4060','MacBook','SSD 1 ТБ','монитор 27','Logitech','роутер Wi‑Fi 6'];
  const L=()=>({hy:1,en:2}[document.documentElement.lang]||0);
  const norm=s=>String(s||'').toLowerCase().replace(/[‑–—]/g,'-').replace(/[″"']/g,'').replace(/ё/g,'е').replace(/\s+/g,' ').trim();
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  /* score: every word must hit the title/spec/brand or a category synonym */
  function search(q){const w=norm(q).split(' ').filter(Boolean);if(!w.length)return[];
    const out=[];I.forEach(x=>{const hay=norm(x.t+' '+x.spec+' '+x.brand),cn=norm(CATS[x.cat].join(' '));let s=0;
      for(const k of w){const syn=SYN[x.cat].some(y=>k.startsWith(y)||y.startsWith(k)&&k.length>=3);
        if(hay.includes(k))s+=norm(x.t).includes(k)?(norm(x.t).startsWith(k)||norm(x.brand)===k?4:3):1;else if(syn||cn.includes(k))s+=2;else return;}
      out.push({...x,score:s});});
    return out.sort((a,b)=>b.score-a.score||a.p-b.p);}
  const lev=(a,b)=>{const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]};
  /* "did you mean": closest brand / title word / category word */
  function suggest(q){const words=[...new Set(I.flatMap(x=>norm(x.t+' '+x.brand).split(/[\s·]+/)).concat(Object.values(SYN).flat()))].filter(x=>x.length>2);
    const k=norm(q).split(' ').pop();if(!k||k.length<3)return null;let best=null,bd=9;words.forEach(x=>{const d=lev(k,x.slice(0,Math.max(k.length,x.length)));if(d<bd){bd=d;best=x}});
    return bd<=Math.max(1,Math.floor(k.length/3))&&best!==k?norm(q).replace(/\S+$/,best):null;}
  const hl=(t,q)=>{let s=esc(t);norm(q).split(' ').filter(k=>k.length>1).forEach(k=>{s=s.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')});return s};
  const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' ֏';
  const RK='led-recent',recent=()=>{try{return JSON.parse(localStorage.getItem(RK))||[]}catch(e){return[]}};
  const remember=q=>{q=q.trim();if(!q)return;const v=recent().filter(x=>norm(x)!==norm(q));v.unshift(q);localStorage.setItem(RK,JSON.stringify(v.slice(0,6)))};
  /* brand tiles / chips → brand page */
  document.addEventListener('click',e=>{const a=e.target.closest('.brands a,#megaBr a,.pdp .brand,.mega-br a');if(!a)return;
    const n=(a.querySelector('svg[aria-label]')?.getAttribute('aria-label')||a.getAttribute('title')||a.textContent).trim().replace(/‑/g,'-');if(!n)return;
    e.preventDefault();location.href='/brand.html?b='+n.toLowerCase().replace(/[^a-z0-9]+/g,'-');},true);
  window.LEDSearch={I,CATS,POP,search,suggest,hl,norm,remember,recent,esc};

  /* header search: Enter / button → /search.html?q=…, live suggestions */
  const T={rec:['Вы искали','Դուք փնտրել եք','Recent'],clr:['Очистить','Մաքրել','Clear'],pop:['Популярные запросы','Հանրաճանաչ որոնումներ','Popular searches'],
    prod:['Товары','Ապրանքներ','Products'],cat:['Категории','Կատեգորիաներ','Categories'],all:['Все результаты','Բոլոր արդյունքները','All results'],none:['Ничего не нашли по запросу','Ոչինչ չգտնվեց','Nothing found for'],dym:['Возможно, вы имели в виду','Գուցե նկատի ունեիք','Did you mean']};
  const t=k=>T[k][L()];
  const PRE=()=>['/ru','','/en'][L()];
  document.querySelectorAll('.search').forEach(box=>{const inp=box.querySelector('input'),btn=box.querySelector('button');if(!inp||box.dataset.sx)return;box.dataset.sx=1;
    inp.setAttribute('type','search');inp.setAttribute('enterkeyhint','search');inp.setAttribute('autocomplete','off');inp.setAttribute('aria-label','search');
    const q0=new URLSearchParams(location.search).get('q');if(q0&&/search(\.html)?$/.test(location.pathname))inp.value=q0;
    const dd=document.createElement('div');dd.className='sx';box.appendChild(dd);let idx=-1,seq=0,tmr=0;
    const go=q=>{q=(q||inp.value).trim();if(!q){inp.focus();return}remember(q);location.href=PRE()+'/search?q='+encodeURIComponent(q)};
    const paint=()=>{const q=inp.value.trim();idx=-1;
      if(!q){const r=recent();dd.innerHTML=(r.length?`<h6>${t('rec')}<button type="button" data-clr>${t('clr')}</button></h6>`+r.map(x=>`<a data-q="${esc(x)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="nm">${esc(x)}</span></a>`).join(''):'')+
        `<h6>${t('pop')}</h6><div class="chips">${POP.map(x=>`<a data-q="${esc(x)}">${esc(x)}</a>`).join('')}</div>`;return}
      const my=++seq;clearTimeout(tmr);tmr=setTimeout(()=>fetch('/api/shop/suggest?q='+encodeURIComponent(q)).then(r=>r.ok?r.json():null).then(d=>{
        if(!d||my!==seq)return;
        if(!d.items.length){dd.innerHTML=`<div class="none">${t('none')} «${esc(q)}»${d.fix?`<br>${t('dym')}: <a data-q="${esc(d.fix)}" style="display:inline;padding:0;color:var(--blue-600);font-weight:600">${esc(d.fix)}</a>`:''}</div>`;return}
        const nm=n=>n[[0,1,2][L()]]||n[0];
        dd.innerHTML=(d.cats.length?`<h6>${t('cat')}</h6><div class="chips">`+d.cats.map(c=>`<a data-q="${esc(q)}" data-c="${esc(c.path)}">${esc(nm(c.name))} <small>${c.n}</small></a>`).join('')+'</div>':'')+
          `<h6>${t('prod')}</h6>`+d.items.map(x=>{const m=/^(.*?)\s*\((.*)\)?$/.exec(x.name)||[0,x.name,''];
            return `<a href="${PRE()}/product/${x.slug}" data-p="${x.code}"><img src="${x.image||'/img/placeholder/'+(x.section||'default')+'.svg'}" alt=""><span class="nm">${hl(m[1],d.fix||q)}<small>${esc((m[2]||'').replace(/\)$/,''))}</small></span><b>${fmt(x.price)}</b></a>`}).join('')+
          `<a class="all" data-q="${esc(d.fix||q)}">${t('all')} (${d.total}) →</a>`;
      }).catch(()=>{}),180);};
    const show=()=>{paint();dd.classList.add('open')},hide=()=>dd.classList.remove('open');
    inp.addEventListener('focus',show);inp.addEventListener('input',show);
    inp.addEventListener('keydown',e=>{const it=[...dd.querySelectorAll('a')];
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!dd.classList.contains('open'))show();idx=(idx+(e.key==='ArrowDown'?1:-1)+it.length)%it.length;it.forEach((a,i)=>a.classList.toggle('on',i===idx));it[idx]&&it[idx].scrollIntoView({block:'nearest'});}
      else if(e.key==='Enter'){e.preventDefault();if(idx>=0&&it[idx])it[idx].click();else go();}
      else if(e.key==='Escape'){hide();inp.blur();}});
    btn&&btn.addEventListener('click',e=>{e.preventDefault();go()});
    dd.addEventListener('mousedown',e=>e.preventDefault());
    dd.addEventListener('click',e=>{const c=e.target.closest('[data-clr]');if(c){localStorage.removeItem(RK);paint();return}
      const a=e.target.closest('a');if(!a)return;if(a.dataset.p){remember(inp.value);return}e.preventDefault();
      if(a.dataset.c){remember(a.dataset.q);location.href=PRE()+'/'+a.dataset.c;return}
      inp.value=a.dataset.q;go(a.dataset.q);});
    document.addEventListener('click',e=>{if(!box.contains(e.target))hide()});
    new MutationObserver(()=>{if(dd.classList.contains('open'))paint()}).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
  });
})();
</script>
<!--/search-box-->
