# Production stack on Mynewserver: /opt/led-computers/docker-compose.yml
# Secrets live in /opt/led-computers/.env (mode 600), see .env.example.
name: led-computers-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: led
      POSTGRES_USER: led
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U led -d led"]
      interval: 10s
      retries: 5

  api:
    image: ghcr.io/narekyeghishyan/led-api:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://led:${POSTGRES_PASSWORD}@db:5432/led
      JWT_SECRET: ${JWT_SECRET}
      SYNC_API_KEY: ${SYNC_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # customer e-mails (password reset codes); empty SMTP_HOST = not sent
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MAIL_DEV_LOG: ${MAIL_DEV_LOG:-}
      # AI photo finder (admin product page)
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_SEARCH: ${AI_SEARCH:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_SEARCH: ${GEMINI_SEARCH:-}
      GOOGLE_CSE_KEY: ${GOOGLE_CSE_KEY:-}
      GOOGLE_CSE_CX: ${GOOGLE_CSE_CX:-}
      BRAVE_SEARCH_KEY: ${BRAVE_SEARCH_KEY:-}
      # AI that sorts in-stock products into site categories: gemini | openai | off (unset = AI_PROVIDER); AUTO=0 = only by button
      AI_CATEGORIES: ${AI_CATEGORIES:-}
      AI_CATEGORIES_AUTO: ${AI_CATEGORIES_AUTO:-}
    volumes:
      - media:/data/media   # product photos, served at /api/media/
    ports:
      - "127.0.0.1:5100:3000"

  admin:
    image: ghcr.io/narekyeghishyan/led-admin:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:80"

volumes:
  db-data:
  media:
