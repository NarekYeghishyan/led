# Production stack on Mynewserver: /opt/led-computers/docker-compose.yml
# Secrets live in /opt/led-computers/.env (mode 600), see .env.example.
name: led-computers-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: led
      POSTGRES_USER: led
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U led -d led"]
      interval: 10s
      retries: 5

  api:
    image: ghcr.io/narekyeghishyan/led-api:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://led:${POSTGRES_PASSWORD}@db:5432/led
      JWT_SECRET: ${JWT_SECRET}
      SYNC_API_KEY: ${SYNC_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5100:3000"

  admin:
    image: ghcr.io/narekyeghishyan/led-admin:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:80"

volumes:
  db-data:
