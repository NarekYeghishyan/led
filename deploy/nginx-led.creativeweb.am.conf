# Host nginx: /etc/nginx/conf.d/led.creativeweb.am.conf
# Keeps the static concept page at /, adds /admin and /api.
server {
  listen 80;
  server_name led.creativeweb.am;
  location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name led.creativeweb.am;
  ssl_certificate     /etc/letsencrypt/live/led.creativeweb.am/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/led.creativeweb.am/privkey.pem;
  add_header X-Robots-Tag "noindex, nofollow" always;
  client_max_body_size 25m;

  # Cloudflare in front: use the real client IP for logs / allowlists
  real_ip_header CF-Connecting-IP;

  location /api/ {
    proxy_pass http://127.0.0.1:5100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }

  location = /admin { return 301 /admin/; }
  location /admin/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
  }

  location / {
    root /var/www/led.creativeweb.am;
    index index.html;
  }
}
