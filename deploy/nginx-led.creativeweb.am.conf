# Host nginx: /etc/nginx/conf.d/led.creativeweb.am.conf (copy of the live file; nginx 1.24 → "listen 443 ssl http2").
# Static templates at /, the admin at /admin, the API at /api, the Next.js storefront (web/) for the pages already ported.
server {
  listen 80; server_name led.creativeweb.am;
  location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl http2; server_name led.creativeweb.am;
  ssl_certificate /etc/letsencrypt/live/led.creativeweb.am/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/led.creativeweb.am/privkey.pem;
  root /var/www/led.creativeweb.am; index index.html;
  add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
  client_max_body_size 60m;

  # LED Computers app: /opt/led-computers (led-computers-prod)
  location /api/ {
    proxy_pass http://127.0.0.1:5100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }
  location = /admin { return 301 /admin/; }
  location /admin/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
  }

  # Next.js storefront (container led-web, 127.0.0.1:5200). Static files (the templates still in /var/www) win; every other
  # path goes to Next.js: categories (/laptops/...), /product/..., /catalog, /ru|/en, and old led.am URLs (301 by the app).
  location /_next/ {
    proxy_pass http://127.0.0.1:5200;
    proxy_set_header Host $host;
    expires 30d;
  }
  location /internal/ { return 404; }  # cache refresh endpoint: only from the api container
  location @web {
    proxy_pass http://127.0.0.1:5200;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header x-led-lang-rewrite "";  # internal marker of web/src/proxy.ts, never from outside
  }

  # template pages that moved to Next.js (plan step 7): /cart.html?lang=ru → 301 /ru/cart (query kept, e.g. search ?q=)
  location ~ ^/(cart|favorites|compare|search|login|registration|forgot-password|account|about|contacts|credit|exchange|delivery|warranty|how-to-buy|how-to-order|how-to-pay)\.html$ {
    set $lp "";
    if ($arg_lang = "ru") { set $lp "/ru"; }
    if ($arg_lang = "en") { set $lp "/en"; }
    return 301 $lp/$1$is_args$args;
  }

  # template brand page → /brand/<slug> (or /brands without ?b=)
  location = /brand.html {
    set $lp "";
    if ($arg_lang = "ru") { set $lp "/ru"; }
    if ($arg_lang = "en") { set $lp "/en"; }
    if ($arg_b ~ "^[a-z0-9-]+$") { return 301 $lp/brand/$arg_b; }
    return 301 $lp/brands;
  }

  # home page lives in Next.js (plan step 7); the old static index.html stays on disk only as a reference
  location = / { try_files /__next_home__ @web; }
  location = /index.html { return 301 /; }

  # static templates (Design/site)
  location /img/ { expires 7d; }
  location / { try_files $uri $uri/ @web; }
}
