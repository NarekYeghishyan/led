# Host nginx: /etc/nginx/conf.d/led.creativeweb.am.conf (copy of the live file; nginx 1.24 → "listen 443 ssl http2").
# Static templates at /, the admin at /admin, the API at /api, the Next.js storefront (web/) for the pages already ported.
server {
  listen 80; server_name led.creativeweb.am;
  location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl http2; server_name led.creativeweb.am;
  ssl_certificate /etc/letsencrypt/live/led.creativeweb.am/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/led.creativeweb.am/privkey.pem;
  root /var/www/led.creativeweb.am; index index.html;
  add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
  client_max_body_size 60m;

  # LED Computers app: /opt/led-computers (led-computers-prod)
  location /api/ {
    proxy_pass http://127.0.0.1:5100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }
  location = /admin { return 301 /admin/; }
  location /admin/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
  }

  # Next.js storefront (container led-web, 127.0.0.1:5200): its assets + the ported pages, in HY (no prefix) / hy (301) / ru / en
  location /_next/ {
    proxy_pass http://127.0.0.1:5200;
    proxy_set_header Host $host;
    expires 30d;
  }
  location ~ ^/(hy/|ru/|en/)?(catalog|p)(/|$) {
    proxy_pass http://127.0.0.1:5200;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header x-led-lang-rewrite "";  # internal marker of web/src/proxy.ts, never from outside
  }

  # static templates (Design/site)
  location /img/ { expires 7d; }
  location / { try_files $uri $uri/ =404; }
}
